name: release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from ?"
        required: true
        default: "main"
      release-version:
        description: "Release version ?"
        required: true
      release-tag:
        description: "Release tag ?"
        required: true
      development-version:
        description: "Next Development version ?"
        required: true


jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Setup git user
        uses: fregante/setup-git-user@v2

      - name: Install Java and Maven
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Prepare maven release
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          DEVELOPMENT_VERSION: ${{ inputs.development-version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          mvn -B -ntp release:prepare \
            -DreleaseVersion="${RELEASE_VERSION}" \
            -DdevelopmentVersion="${DEVELOPMENT_VERSION}" \
            -Dtag="${RELEASE_TAG}" \
            -Darguments="-DskipTests"
          
  perform-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}

      - name: Setup git user
        uses: fregante/setup-git-user@v2

      - name: Set up JDK 25, Central Portal credentials and GPG signing
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
          gpg-private-key: ${{ secrets.gpg_private_key }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Stage all Maven modules
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
          CENTRAL_USERNAME: ${{ secrets.sonatype_username }}
          CENTRAL_PASSWORD: ${{ secrets.sonatype_password }}
        run: |
          mvn -s .github/maven-settings.xml -B -ntp \
            -Prelease \
            -DskipTests \
            -DaltDeploymentRepository=sonatype-central-portal::njord: \
            deploy

      - name: Publish Maven artifacts to Sonatype Central
        env:
          CENTRAL_USERNAME: ${{ secrets.sonatype_username }}
          CENTRAL_PASSWORD: ${{ secrets.sonatype_password }}
        run: |
          mvn -s .github/publish-settings.xml -N -B -ntp \
            -Prelease \
            -Dpublisher=sonatype-cp \
            njord:publish

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{inputs.release-version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./ad2image-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release-tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
